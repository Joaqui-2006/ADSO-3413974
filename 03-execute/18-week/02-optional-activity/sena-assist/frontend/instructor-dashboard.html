<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SENA Assist — Panel del instructor</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<header class="topbar">
  <div class="marca">
    <div class="isotipo">SA</div>
    <div class="nombre">SENA <span>Assist</span></div>
  </div>
  <div class="flex gap-16">
    <a href="instructor-historial.html" class="btn btn-fantasma">Historial</a>
    <div class="usuario-pill">
      <div class="avatar" id="iniciales">--</div>
      <span id="nombre-usuario">Cargando...</span>
    </div>
    <button class="btn btn-fantasma" onclick="Sesion.cerrar()">Salir</button>
  </div>
</header>

<div class="contenedor">
  <span class="eyebrow">Mis clases</span>
  <h1>Selecciona una clase para tomar asistencia</h1>
  <p class="texto-tenue">Solo ves las clases que tienes asignadas por el administrador.</p>

  <div id="lista-clases" class="grid-3 mt-24">
    <p class="texto-tenue">Cargando clases...</p>
  </div>

  <div id="panel-horarios" class="tarjeta mt-24 oculto">
    <div class="flex-entre">
      <h3 id="titulo-horarios">Sesiones de la clase</h3>
      <button class="btn btn-fantasma" onclick="ocultarHorarios()">Cerrar</button>
    </div>
    <table class="mt-16">
      <thead>
        <tr><th>Fecha</th><th>Hora</th><th>Estado del QR</th><th></th></tr>
      </thead>
      <tbody id="cuerpo-horarios"></tbody>
    </table>
  </div>
</div>

<script src="js/api.js"></script>
<script>
const usuario = Sesion.requerir('Instructor');
if (usuario) {
  document.getElementById('nombre-usuario').textContent = `${usuario.nombres} ${usuario.apellidos}`;
  document.getElementById('iniciales').textContent = (usuario.nombres[0] + usuario.apellidos[0]).toUpperCase();
}

let claseSeleccionada = null;

async function cargarClases() {
  const contenedor = document.getElementById('lista-clases');
  try {
    const clases = await apiFetch('/instructor/clases');
    if (clases.length === 0) {
      contenedor.innerHTML = `<div class="estado-vacio"><div class="icono">📋</div>Aún no tienes clases asignadas.</div>`;
      return;
    }
    contenedor.innerHTML = clases.map(c => `
      <div class="tarjeta tarjeta-clase" onclick="verHorarios(${c.id_clase}, '${c.nombre_clase.replace(/'/g, "")}')">
        <span class="eyebrow">Ficha ${c.numero_ficha} · ${c.jornada}</span>
        <h3>${c.nombre_clase}</h3>
        <p class="texto-tenue">${c.programa}</p>
        <p class="texto-tenue">📍 ${c.ambiente}</p>
      </div>
    `).join('');
  } catch (err) {
    contenedor.innerHTML = `<div class="aviso aviso-error">${err.message}</div>`;
  }
}

async function verHorarios(idClase, nombreClase) {
  claseSeleccionada = idClase;
  document.getElementById('titulo-horarios').textContent = `Sesiones — ${nombreClase}`;
  document.getElementById('panel-horarios').classList.remove('oculto');
  const cuerpo = document.getElementById('cuerpo-horarios');
  cuerpo.innerHTML = `<tr><td colspan="4">Cargando...</td></tr>`;

  try {
    const horarios = await apiFetch(`/instructor/clases/${idClase}/horarios`);
    if (horarios.length === 0) {
      cuerpo.innerHTML = `<tr><td colspan="4">No hay sesiones programadas para esta clase.</td></tr>`;
      return;
    }
    cuerpo.innerHTML = horarios.map(h => `
      <tr>
        <td>${h.fecha}</td>
        <td>${h.hora_inicio.slice(0,5)} - ${h.hora_fin.slice(0,5)}</td>
        <td>${h.id_qr ? '<span class="badge badge-presente"><span class="badge-dot"></span>QR activo</span>' : '<span class="badge badge-ausente">Sin QR</span>'}</td>
        <td><a class="btn btn-primario" href="qr-session.html?horario=${h.id_horario}">Abrir sesión</a></td>
      </tr>
    `).join('');
  } catch (err) {
    cuerpo.innerHTML = `<tr><td colspan="4">${err.message}</td></tr>`;
  }
}

function ocultarHorarios() {
  document.getElementById('panel-horarios').classList.add('oculto');
}

cargarClases();
</script>
</body>
</html>
