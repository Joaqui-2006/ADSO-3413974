<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SENA Assist — Historial</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<header class="topbar">
  <div class="marca">
    <div class="isotipo">SA</div>
    <div class="nombre">SENA <span>Assist</span></div>
  </div>
  <div class="flex gap-16">
    <a href="instructor-dashboard.html" class="btn btn-fantasma">← Mis clases</a>
    <button class="btn btn-fantasma" onclick="Sesion.cerrar()">Salir</button>
  </div>
</header>

<div class="contenedor">
  <span class="eyebrow">Historial</span>
  <h1>Sesiones anteriores</h1>
  <p class="texto-tenue">Consulta la asistencia de todas tus clases, con la proporción de aprendices presentes.</p>

  <div class="tarjeta mt-24">
    <table>
      <thead>
        <tr><th>Fecha</th><th>Clase</th><th>Ficha</th><th>Horario</th><th>Asistencia</th><th></th></tr>
      </thead>
      <tbody id="cuerpo-historial">
        <tr><td colspan="6">Cargando...</td></tr>
      </tbody>
    </table>
  </div>
</div>

<script src="js/api.js"></script>
<script>
Sesion.requerir('Instructor');

async function cargarHistorial() {
  const cuerpo = document.getElementById('cuerpo-historial');
  try {
    const registros = await apiFetch('/instructor/historial');
    if (registros.length === 0) {
      cuerpo.innerHTML = `<tr><td colspan="6">Aún no hay sesiones registradas.</td></tr>`;
      return;
    }
    cuerpo.innerHTML = registros.map(r => {
      const porcentaje = r.total_aprendices > 0 ? Math.round((r.presentes / r.total_aprendices) * 100) : 0;
      return `
        <tr>
          <td>${r.fecha}</td>
          <td>${r.nombre_clase}</td>
          <td>${r.numero_ficha}</td>
          <td>${r.hora_inicio.slice(0,5)} - ${r.hora_fin.slice(0,5)}</td>
          <td>${r.presentes}/${r.total_aprendices} (${porcentaje}%)</td>
          <td><a class="btn btn-fantasma" href="qr-session.html?horario=${r.id_horario}">Ver detalle</a></td>
        </tr>
      `;
    }).join('');
  } catch (err) {
    cuerpo.innerHTML = `<tr><td colspan="6">${err.message}</td></tr>`;
  }
}

cargarHistorial();
</script>
</body>
</html>
