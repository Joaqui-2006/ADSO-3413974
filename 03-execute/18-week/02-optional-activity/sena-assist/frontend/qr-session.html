<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SENA Assist — Sesión de asistencia</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<header class="topbar">
  <div class="marca">
    <div class="isotipo">SA</div>
    <div class="nombre">SENA <span>Assist</span></div>
  </div>
  <div class="flex gap-16">
    <a href="instructor-dashboard.html" class="btn btn-fantasma">← Mis clases</a>
    <button class="btn btn-peligro" id="btn-cerrar-asistencia">Cerrar asistencia</button>
  </div>
</header>

<div class="contenedor">
  <div class="grid-2" style="grid-template-columns: 340px 1fr; align-items: start;">

    <!-- Columna QR -->
    <div class="tarjeta">
      <span class="eyebrow">Código QR de la sesión</span>
      <h3>Escanea para registrar asistencia</h3>

      <div class="qr-caja" id="zona-qr">
        <p class="texto-tenue">Generando código...</p>
      </div>

      <div class="grid-2" style="grid-template-columns: 1fr; gap: 10px;">
        <label for="duracion">Duración del QR</label>
        <select id="duracion">
          <option value="300">5 minutos</option>
          <option value="600">10 minutos</option>
          <option value="900" selected>15 minutos</option>
          <option value="1800">30 minutos</option>
        </select>
        <button class="btn btn-secundario btn-bloque" id="btn-regenerar">🔄 Regenerar QR</button>
      </div>
    </div>

    <!-- Columna asistencia en vivo -->
    <div class="tarjeta">
      <div class="flex-entre">
        <div>
          <span class="eyebrow">En vivo</span>
          <h3>Asistencia de la sesión</h3>
        </div>
        <div class="flex gap-8">
          <span class="badge badge-presente" id="contador-presentes"><span class="badge-dot"></span>0 presentes</span>
          <span class="badge badge-ausente" id="contador-ausentes">0 pendientes</span>
        </div>
      </div>

      <input type="text" id="buscador" placeholder="Buscar aprendiz por nombre o documento..." class="mt-16">

      <table>
        <thead>
          <tr><th>Aprendiz</th><th>Documento</th><th>Hora</th><th>Estado</th><th></th></tr>
        </thead>
        <tbody id="cuerpo-asistencia">
          <tr><td colspan="5">Cargando...</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.5/socket.io.min.js"></script>
<script src="js/api.js"></script>
<script>
const usuario = Sesion.requerir('Instructor');
const params = new URLSearchParams(window.location.search);
const idHorario = params.get('horario');
if (!idHorario) window.location.href = 'instructor-dashboard.html';

let listaCompleta = [];
let cuentaRegresivaIntervalo = null;

// --- Conexión en tiempo real ---
const socket = io('http://localhost:4000');
socket.on('connect', () => socket.emit('unirse_sesion', idHorario));
socket.on('nueva_asistencia', (registro) => {
  actualizarRegistroLocal(registro.id_aprendiz, {
    estado: 'presente',
    hora_registro: registro.hora_registro,
    id_asistencia: registro.id_asistencia,
    registrado_por: 'qr'
  });
  renderTabla();
});
socket.on('asistencia_actualizada', (evento) => {
  actualizarRegistroLocal(evento.id_aprendiz, { estado: evento.estado });
  renderTabla();
});

function actualizarRegistroLocal(idAprendiz, cambios) {
  const item = listaCompleta.find(a => a.id_aprendiz === idAprendiz);
  if (item) Object.assign(item, cambios, { _nuevo: true });
}

// --- Generar / regenerar QR ---
async function generarQR() {
  const duracion = document.getElementById('duracion').value;
  const zonaQR = document.getElementById('zona-qr');
  zonaQR.innerHTML = `<p class="texto-tenue">Generando código...</p>`;
  try {
    const datos = await apiFetch(`/instructor/horarios/${idHorario}/qr`, {
      method: 'POST',
      body: JSON.stringify({ duracion_segundos: Number(duracion) })
    });
    zonaQR.innerHTML = `
      <img src="${datos.qr_imagen}" alt="Código QR de la sesión">
      <div class="temporizador" id="temporizador">--:--</div>
      <p class="texto-tenue">Válido hasta que expire o lo regeneres</p>
    `;
    iniciarCuentaRegresiva(new Date(datos.expira_en));
  } catch (err) {
    zonaQR.innerHTML = `<div class="aviso aviso-error">${err.message}</div>`;
  }
}

function iniciarCuentaRegresiva(fechaExpira) {
  if (cuentaRegresivaIntervalo) clearInterval(cuentaRegresivaIntervalo);
  const el = document.getElementById('temporizador');
  cuentaRegresivaIntervalo = setInterval(() => {
    const restante = Math.max(0, Math.floor((fechaExpira - new Date()) / 1000));
    const min = String(Math.floor(restante / 60)).padStart(2, '0');
    const seg = String(restante % 60).padStart(2, '0');
    if (el) el.textContent = `${min}:${seg}`;
    if (restante <= 0) clearInterval(cuentaRegresivaIntervalo);
  }, 1000);
}

document.getElementById('btn-regenerar').addEventListener('click', generarQR);

document.getElementById('btn-cerrar-asistencia').addEventListener('click', async () => {
  if (!confirm('¿Cerrar la asistencia de esta sesión? El QR dejará de funcionar.')) return;
  try {
    await apiFetch(`/instructor/horarios/${idHorario}/cerrar`, { method: 'PUT' });
    alert('Asistencia cerrada. Toda la información quedó almacenada.');
    window.location.href = 'instructor-dashboard.html';
  } catch (err) {
    alert(err.message);
  }
});

// --- Lista de asistencia ---
async function cargarLista() {
  try {
    listaCompleta = await apiFetch(`/instructor/horarios/${idHorario}/asistencia`);
    renderTabla();
  } catch (err) {
    document.getElementById('cuerpo-asistencia').innerHTML = `<tr><td colspan="5">${err.message}</td></tr>`;
  }
}

function badgeEstado(estado) {
  const mapa = {
    presente: ['badge-presente', 'Presente'],
    ausente: ['badge-ausente', 'Ausente'],
    tarde: ['badge-tarde', 'Tarde'],
    justificado: ['badge-justificado', 'Justificado']
  };
  const [clase, texto] = mapa[estado] || mapa.ausente;
  return `<span class="badge ${clase}"><span class="badge-dot"></span>${texto}</span>`;
}

function renderTabla() {
  const filtro = document.getElementById('buscador').value.trim().toLowerCase();
  const cuerpo = document.getElementById('cuerpo-asistencia');

  const visibles = listaCompleta.filter(a =>
    `${a.nombres} ${a.apellidos} ${a.numero_documento}`.toLowerCase().includes(filtro)
  );

  if (visibles.length === 0) {
    cuerpo.innerHTML = `<tr><td colspan="5">Sin resultados.</td></tr>`;
  } else {
    cuerpo.innerHTML = visibles.map(a => `
      <tr class="${a._nuevo ? 'fila-nueva' : ''}">
        <td>${a.nombres} ${a.apellidos}</td>
        <td>${a.tipo_documento} ${a.numero_documento}</td>
        <td>${a.hora_registro ? a.hora_registro.slice(0,5) : '—'}</td>
        <td>${badgeEstado(a.estado || 'ausente')}</td>
        <td>
          ${a.estado !== 'presente'
            ? `<button class="btn btn-secundario" onclick="marcarManual(${a.id_aprendiz})">Marcar presente</button>`
            : `<button class="btn btn-fantasma" onclick="marcarManual(${a.id_aprendiz}, 'ausente')">Marcar ausente</button>`}
        </td>
      </tr>
    `).join('');
  }

  const presentes = listaCompleta.filter(a => a.estado === 'presente').length;
  document.getElementById('contador-presentes').innerHTML = `<span class="badge-dot"></span>${presentes} presentes`;
  document.getElementById('contador-ausentes').textContent = `${listaCompleta.length - presentes} pendientes`;

  setTimeout(() => { listaCompleta.forEach(a => a._nuevo = false); }, 1500);
}

async function marcarManual(idAprendiz, estado = 'presente') {
  try {
    await apiFetch(`/instructor/horarios/${idHorario}/asistencia-manual`, {
      method: 'POST',
      body: JSON.stringify({ id_aprendiz: idAprendiz, estado })
    });
    actualizarRegistroLocal(idAprendiz, { estado, hora_registro: new Date().toTimeString().slice(0,8) });
    renderTabla();
  } catch (err) {
    alert(err.message);
  }
}

document.getElementById('buscador').addEventListener('input', renderTabla);

generarQR();
cargarLista();
setInterval(cargarLista, 15000); // respaldo por si el socket se desconecta
</script>
</body>
</html>
